# Render Blueprint for IceHrm (All-in-One)
# Documentation: https://render.com/docs/blueprint-spec
#
# This blueprint uses the all-in-one Docker image that includes:
# - Nginx (web server)
# - PHP-FPM (PHP processor)
# - MySQL/MariaDB (database)
# - Crond (background jobs)
#
# Deployment:
#   1. Fork this repository to your GitHub account
#   2. Go to https://dashboard.render.com/blueprints
#   3. Click "New Blueprint Instance" and connect your repository
#   4. Deploy (APP_BASE_URL is auto-detected from RENDER_EXTERNAL_URL)
#
# Note: The all-in-one Dockerfile includes a build stage that runs:
#   - npm install (for root and web directories)
#   - npm run asset:build:prod (compiles frontend assets)

services:
  # IceHrm All-in-One (Web + Database + Worker)
  - type: web
    name: icehrm
    runtime: docker
    dockerfilePath: ./docker-all-in-one/Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /app/health.php
    disk:
      name: icehrm-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: MYSQL_DATABASE
        value: icehrm
      - key: MYSQL_USER
        value: icehrm
      - key: MYSQL_PASSWORD
        generateValue: true
