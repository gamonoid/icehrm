<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>#_company_name_#</title>
    <style type="text/css">
        body { margin: 0; padding: 0; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table { border-collapse: collapse; }
        img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
        a { color: #346CB0; }
        @media only screen and (max-width: 620px) {
            .email-card { width: 100% !important; border-radius: 0 !important; }
            .email-pad { padding: 28px 22px !important; }
        }
    </style>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;">
<!-- Preview text shown by mail apps next to the subject -->
<div style="display:none;font-size:1px;line-height:1px;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">
    #_preheader_#
</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f3f4f6;">
    <tr>
        <td align="center" style="padding:32px 12px;">
            <table role="presentation" class="email-card" width="600" cellpadding="0" cellspacing="0" border="0"
                   style="width:600px;max-width:600px;background-color:#ffffff;border:1px solid #e5e7eb;border-radius:12px;">
                <!-- Logo -->
                <tr>
                    <td align="left" style="padding:28px 40px 0 40px;">
                        <a href="#_url_#" target="_blank" style="text-decoration:none;">
                            <img src="#_logourl_#" alt="#_company_name_#" style="display:block;max-height:44px;max-width:220px;height:auto;">
                        </a>
                    </td>
                </tr>
                <!-- Body -->
                <tr>
                    <td class="email-pad" style="padding:28px 40px 20px 40px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:15px;line-height:1.6;color:#1f2937;">
                        #_emailBody_#
                    </td>
                </tr>
            </table>
            <!-- Footer -->
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;">
                <tr>
                    <td align="center" style="padding:20px 40px 0 40px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:12px;line-height:1.6;color:#6b7280;">
                        #_emailReason_#
                        If you think this email was not meant for you, please let <a href="mailto:#_adminEmail_#" style="color:#6b7280;">#_adminEmail_#</a> know.
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding:10px 40px 32px 40px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:12px;line-height:1.6;color:#9ca3af;">
                        #_company_name_# &middot; Sent with <a href="#_icehrm_url_#" target="_blank" style="color:#9ca3af;">IceHrm</a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
