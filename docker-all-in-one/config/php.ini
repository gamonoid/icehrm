[Date]
date.timezone="UTC"

[PHP]
memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 300
max_input_time = 300

; Error handling
display_errors = Off
log_errors = On
error_log = /var/log/icehrm/php-error.log

; Opcache for better performance
[opcache]
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
