# Testing stack. Host ports use the 918x/938x block so this can run alongside
# the dev stack, icehrm-pro and the release-test stacks.
services:
  mysql-testing:
    image: mysql:5.7
    ports:
      - 127.0.0.1:9387:3306
    environment:
      MYSQL_ROOT_PASSWORD: IceHrmR00t
      MYSQL_USER: testing
      MYSQL_PASSWORD: testing
      MYSQL_DATABASE: icehrm
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/setup.sql
      - ./docker/testing/db_data:/var/lib/mysql

  icehrm-testing:
    build:
      context: ./
      dockerfile: Dockerfile-testing
    ports:
      # Host 9183 -> container 8090. Cypress reaches the app over the compose
      # network at http://icehrm-testing:8090, so it is unaffected by this.
      - 9183:8090
    logging:
      driver: none
    depends_on:
      - mysql-testing

  # Cypress container
  cypress:
    # the Docker image to use from https://github.com/cypress-io/cypress-docker-images
    image: "cypress/included:3.2.0"
    depends_on:
      - icehrm-testing
    environment:
      # pass base url to test pointing at the web application
      - CYPRESS_baseUrl=http://icehrm-testing:8090
    # share the current folder as volume to avoid copying
    working_dir: /e2e
    volumes:
      - ./test/frontend:/e2e
volumes:
  db_data:
