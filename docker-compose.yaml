# Development stack for the open-source repo.
#
# Ports use the 918x block so this stack can run alongside icehrm-pro (908x),
# the release-test stacks (919x / 929x) and the production stack (5555).
# Database and phpMyAdmin bind to loopback only — phpMyAdmin is an
# unauthenticated console and MySQL here uses well-known dev credentials.
services:
  mysql:
    image: mysql:8.0.32
    #command: --lower_case_table_names=1
    ports:
      - 127.0.0.1:9386:3306
    environment:
      MYSQL_ROOT_PASSWORD: IceHrmR00t
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
      MYSQL_DATABASE: icehrm
    volumes:
      - ./docker/init.sql:/docker-entrypoint-initdb.d/setup.sql
      - ./docker/development/db_data:/var/lib/mysql

  icehrm:
    build:
      context: .
      dockerfile: Dockerfile-dev
    ports:
      - 9180:8080
    environment:
      ICE_CONFIG_FILE: ../docker/development/config/config.php
    volumes:
      - .:/var/www/html

  icehrm-worker-dev:
    build:
      context: ./
      dockerfile: Dockerfile-worker
      args:
        - EXE_ENV=development
    volumes:
      - .:/var/www/html
      - ./docker/development/config/config.php:/var/www/html/app/config.php

  phpmyadmin-dev:
    depends_on:
      - mysql
    image: phpmyadmin
    ports:
      # Loopback only — this is an unauthenticated database console.
      - "127.0.0.1:9181:80"
    environment:
      PMA_HOSTS: mysql
      # Container-internal port. MySQL listens on 3306 inside the compose
      # network; 9386 is only the host-side publish mapping.
      PMA_PORT: 3306
      PMA_USER: dev
      PMA_PASSWORD: dev

  mailhog:
    image: ajoergensen/mailhog
    ports:
      - "1186:1025"
      - "9182:8025"
volumes:
  db_data:
