  /payroll_config/payrolls/{id}/reprocess:
    post:
      tags:
        - Payroll
      summary: Reprocess a Payroll
      description: >-
        Recomputes a payroll's values and persists them (status returns to Processed).
        Blocked for a Completed payroll — delete its payslips first. Pass
        `clearData: true` to wipe existing computed/edited values for a clean recompute.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                clearData:
                  type: boolean
                  description: Delete existing PayrollData rows before recomputing.
      responses:
        '200':
          description: Payroll reprocessed
        '400':
          description: Payroll is Completed (delete payslips first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Payroll not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

