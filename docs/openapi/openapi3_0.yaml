                  date_start: "2026-04-12"
                  date_end: "2026-04-18"
                  status: "Pending"
                  days:
                    - date: "2026-04-12"
                      display: "(Sun) 12 Apr"
                    - date: "2026-04-13"
                      display: "(Mon) 13 Apr"
                created: true
        '200':
          description: Timesheet already exists for next week
          content:
            application/json:
              example:
                timesheet:
                  id: 43
                  date_start: "2026-04-12"
                  date_end: "2026-04-18"
                  status: "Pending"
                created: false
                message: "Timesheet already exists for next week"
        '404':
          description: Reference timesheet not found

  /timesheets/{timesheetId}:
    get:
      tags:
        - Timesheets
      summary: Get Timesheet Details
      description: |
        Get detailed information about a specific timesheet including all time entries.
      parameters:
        - name: timesheetId
          in: path
          required: true
          schema:
            type: integer
          description: Timesheet ID
      responses:
        '200':
          description: Timesheet details with entries
          content:
            application/json:
              example:
                timesheet:
                  id: 42
                  employee: 5
                  date_start: "2026-04-05"
                  date_end: "2026-04-11"
                  status: "Pending"
                  total_time: "16:30"
                  total_minutes: 990
                  days:
                    - date: "2026-04-05"
                      display: "(Sun) 05 Apr"
                    - date: "2026-04-06"
                      display: "(Mon) 06 Apr"
                entries:
                  - id: 156
                    employee: 5
                    timesheet: 42
                    project:
                      type: "Project"
                      id: 3
                      display: "Mobile App Development"
                    date_start: "2026-04-06 09:00:00"
                    date_end: "2026-04-06 17:30:00"
                    details: "Implemented timesheet API"
                    duration_minutes: 510
                    duration_hours: 8.5
                  - id: 157
                    employee: 5
                    timesheet: 42
                    project: null
                    date_start: "2026-04-07 10:00:00"
