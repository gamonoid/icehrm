                - start_time
                - end_time
              properties:
                date:
                  type: string
                  format: date
                  description: Date of the time entry
                start_time:
                  type: string
                  description: Start time (HH:MM:SS)
                end_time:
                  type: string
                  description: End time (HH:MM:SS)
                project:
                  type: integer
                  description: Project ID (optional)
                details:
                  type: string
                  description: Work description
            example:
              date: "2026-04-07"
              start_time: "09:00:00"
              end_time: "17:30:00"
              project: 3
              details: "Implemented new API endpoints for mobile app"
      responses:
        '201':
          description: Time entry created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
              example:
                id: 158
                employee: 5
                timesheet: 42
                project: 3
                date_start: "2026-04-07 09:00:00"
                date_end: "2026-04-07 17:30:00"
                time_start: "09:00:00"
                time_end: "17:30:00"
                details: "Implemented new API endpoints for mobile app"
                duration_minutes: 510
                duration_hours: 8.5
                status: "Active"
        '400':
