        - Timesheets
      summary: Submit Timesheet for Approval
      description: |
        Submit a timesheet for approval by the supervisor.
        Only the timesheet owner can submit their own timesheet.
        If the user is an admin without a supervisor, the timesheet is auto-approved.
      parameters:
        - name: timesheetId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Timesheet submitted successfully
          content:
            application/json:
              example:
                message: "Timesheet Submitted"
                timesheet:
                  id: 42
                  status: "Submitted"
                  total_time: "40:00"
        '403':
          description: Permission denied

  /timesheets/{timesheetId}/entries:
    post:
      tags:
        - Timesheets
      summary: Add Time Entry to Timesheet
      description: |
        Add a new time entry to a timesheet.
        The date must be within the timesheet period.
        Cannot add entries to approved timesheets.
      parameters:
        - name: timesheetId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
