    get:
      tags:
        - Payroll
      summary: Export Payroll Data (Backup)
      description: >-
        Returns a JSON backup of all UI-managed payroll tables (payroll columns, payslip
        templates, payroll-employees, payroll runs, and computed payroll data), preserving
        primary keys so it can be restored exactly via the import endpoint.
      responses:
        '200':
          description: Payroll backup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayrollBackup'
  /payroll_config/import/payroll:
    post:
      tags:
        - Payroll
      summary: Import/Restore Payroll Data
      description: >-
        Restores a payroll backup produced by the export endpoint. Rows are written with
        REPLACE INTO in dependency order, preserving ids. Intended for a "clear existing
        data, then restore" workflow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayrollBackup'
      responses:
        '200':
          description: Restore summary (rows restored per table)
        '400':
          description: Invalid backup, wrong section, or restore errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payroll_config/export/salary:
    get:
      tags:
        - Payroll
      summary: Export Salary Data (Backup)
      description: >-
        Returns a JSON backup of all UI-managed salary tables (salary component types,
        salary components, and employee salary line items), preserving primary keys.
      responses:
        '200':
          description: Salary backup
          content:
            application/json:
              schema:
