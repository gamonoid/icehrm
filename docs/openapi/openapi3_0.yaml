  # ============================================
  # TIMESHEETS
  # ============================================
  /timesheets:
    get:
      tags:
        - Timesheets
      summary: Get My Timesheets
      description: |
        Retrieves the current user's timesheets.
        Use the `status` query parameter to filter by status.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [Pending, Submitted, Approved, Rejected]
          description: Filter by timesheet status
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
          description: Maximum number of results
      responses:
        '200':
          description: List of timesheets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Timesheet'
                  total:
                    type: integer
                  page:
                    type: integer
                  nextPage:
                    type: integer
                    nullable: true
              example:
                data:
                  - id: 42
                    employee: 5
                    date_start: "2026-04-05"
                    date_end: "2026-04-11"
                    status: "Pending"
                    total_time: "32:30"
                    total_minutes: 1950
                  - id: 41
                    employee: 5
                    date_start: "2026-03-29"
                    date_end: "2026-04-04"
                    status: "Approved"
                    total_time: "40:00"
                    total_minutes: 2400
                total: 10
                page: 1
                nextPage: null

  /timesheets/create-current:
    post:
      tags:
        - Timesheets
      summary: Create Current Week Timesheet
      description: |
        Create a timesheet for the current week (Sunday to Saturday).
        If a timesheet already exists for the current week, returns the existing one.
      responses:
        '201':
          description: Timesheet created successfully
          content:
            application/json:
              example:
                timesheet:
                  id: 43
                  employee: 5
                  date_start: "2026-04-05"
                  date_end: "2026-04-11"
                  status: "Pending"
                  days:
                    - date: "2026-04-05"
                      display: "(Sun) 05 Apr"
                    - date: "2026-04-06"
                      display: "(Mon) 06 Apr"
                created: true
        '200':
          description: Timesheet already exists
          content:
            application/json:
              example:
                timesheet:
                  id: 42
                  employee: 5
                  date_start: "2026-04-05"
                  date_end: "2026-04-11"
                  status: "Pending"
                  total_time: "16:30"
                created: false
                message: "Timesheet already exists for current week"

  /timesheets/{timesheetId}/create-previous:
    post:
      tags:
        - Timesheets
      summary: Create Previous Week Timesheet
      description: |
        Create a timesheet for the week before the specified timesheet.
        Calculates dates based on the reference timesheet's start date.
      parameters:
        - name: timesheetId
          in: path
          required: true
          schema:
            type: integer
          description: Reference timesheet ID
      responses:
        '201':
          description: Previous week timesheet created
          content:
            application/json:
              example:
                timesheet:
                  id: 41
                  employee: 5
                  date_start: "2026-03-29"
                  date_end: "2026-04-04"
                  status: "Pending"
                  days:
                    - date: "2026-03-29"
                      display: "(Sun) 29 Mar"
                    - date: "2026-03-30"
                      display: "(Mon) 30 Mar"
                created: true
        '200':
          description: Timesheet already exists for previous week
          content:
            application/json:
              example:
                timesheet:
                  id: 40
                  date_start: "2026-03-29"
                  date_end: "2026-04-04"
                  status: "Approved"
                  total_time: "40:00"
                created: false
                message: "Timesheet already exists for previous week"
        '404':
          description: Reference timesheet not found

  /timesheets/{timesheetId}/create-next:
    post:
      tags:
        - Timesheets
      summary: Create Next Week Timesheet
      description: |
        Create a timesheet for the week after the specified timesheet.
        Calculates dates based on the reference timesheet's end date.
      parameters:
        - name: timesheetId
          in: path
          required: true
          schema:
            type: integer
