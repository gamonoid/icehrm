  /payroll_config/import/salary:
    post:
      tags:
        - Payroll
      summary: Import/Restore Salary Data
      description: Restores a salary backup produced by the export endpoint (REPLACE INTO, ids preserved).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayrollBackup'
      responses:
        '200':
          description: Restore summary (rows restored per table)
        '400':
          description: Invalid backup, wrong section, or restore errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /payroll_config/clear:
    post:
      tags:
        - Payroll
      summary: Clear Payroll Data (Destructive)
      description: >-
        Permanently deletes the selected categories of payroll data. Each category is opt-in
        via `targets`. Requires the exact confirmation phrase `DELETE PAYROLL DATA` (also
        enforced by the UI). Export a backup first if the data may be needed again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets, confirm]
              properties:
                targets:
                  type: array
                  description: One or more of the categories to delete.
                  items:
                    type: string
                    enum: [columns, payrolls, designs, groups]
                  example: [columns, payrolls, designs, groups]
                confirm:
                  type: string
                  description: Must equal "DELETE PAYROLL DATA".
                  example: "DELETE PAYROLL DATA"
      responses:
        '200':
          description: Deletion summary (rows deleted per category)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  deleted:
                    type: object
                    additionalProperties:
                      type: integer
        '400':
          description: Missing/incorrect confirmation phrase or no targets selected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

