  # ============================================
  /tasks:
    get:
      tags:
        - Tasks
      summary: Get Task List
      responses:
        '200':
          description: List of tasks

  /task-list/{id}/status:
    post:
      tags:
        - Tasks
      summary: Update Task List Status
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [Open, Completed]
      responses:
        '200':
          description: Task status updated

  /task-lists:
    post:
      tags:
        - Tasks
      summary: Create a Task List
      description: >-
        Create a task list from a list of tasks. `type` defaults to "General"
        when empty. Tasks may be assigned to employees inline (task object with
        an `employee` id) and/or via the separate `assignments` array; tasks
        with no employee stay unassigned. `owner` defaults to the employee that
        owns the access token when omitted. Each assigned employee is notified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskListCreate'
            examples:
              withAssignments:
                summary: Some tasks assigned, one via the assignments array
                value:
                  name: New Hire Onboarding - Jane Doe
                  description: First-week onboarding checklist
                  type: Onboarding
                  owner: 143
                  status: Open
                  tasks:
                    - Prepare laptop and accounts
                    - text: Grant repository access
                      employee: 147
                    - Schedule intro meetings
                  assignments:
                    - task: 0
                      employee: 143
              unassigned:
                summary: All tasks unassigned (owner defaults to token holder)
                value:
                  name: Office Safety Audit
                  tasks:
                    - Inspect fire extinguishers
                    - Test emergency lighting
      responses:
        '201':
          description: Task list created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '400':
          description: Missing name/tasks or invalid status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Owner employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Tasks
      summary: List Task Lists
      description: >-
        Returns task lists visible to the caller. Admins see all; other users
        see task lists they own or are assigned to. Task details are omitted
        from the list; fetch a single list to get its tasks.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        '200':
          description: Paginated task lists
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  page:
                    type: integer
                  limit:
                    type: integer
                  taskLists:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskList'

  /task-lists/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags:
        - Tasks
      summary: Get a Task List
      description: Returns a task list with its tasks and assignees.
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task list not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Tasks
      summary: Modify a Task List
      description: >-
        Update a task list. All fields are optional. Providing `tasks` replaces
        the whole checklist and re-syncs assignments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskListUpdate'
      responses:
        '200':
          description: Updated task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '400':
          description: Invalid status / empty name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task list not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Tasks
      summary: Delete a Task List
      description: Deletes the task list, its editor document and all assignment rows.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  deleted:
                    type: boolean
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task list not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /task-lists/{id}/tasks/{taskIndex}/assign:
    post:
      tags:
        - Tasks
      summary: Assign a Task to an Employee
      description: >-
        Assign (or unassign) a single task, identified by its 0-based index, to
        an employee. Pass an `employee` id to assign, or null/omit it to clear
        the assignment. Assignment rows are re-synced and the employee notified.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: taskIndex
          in: path
          required: true
          schema:
            type: integer
          description: 0-based index of the task within the list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                employee:
                  type: integer
                  nullable: true
                  description: Employee id to assign; null/omitted clears the assignment.
      responses:
        '200':
          description: Updated task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task list, tasks document, employee or task index not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

