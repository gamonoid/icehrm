  # ============================================
  # EXPENSES
  # ============================================
  /expenses:
    get:
      tags:
        - Expenses
      summary: Get User Expenses
      description: |
        Retrieves the current user's expense requests (up to 100 most recent).
        Results include category, payment method, and currency details.
      responses:
        '200':
          description: List of user expenses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Expense'

  /expense:
    post:
      tags:
        - Expenses
      summary: Add Expense with Optional Receipt Upload
      description: |
        Create a new expense request with optional receipt image upload.

        **Receipt Upload for Mobile Apps (Flutter, React Native, etc.)**:
        You can include receipt images captured via camera directly in the JSON payload
        using base64 encoding. This eliminates the need for a separate file upload step.

        **Supported formats**: jpg, jpeg, png, gif, bmp, webp, heic, heif
        **Maximum file size**: 10MB per image
        **Maximum attachments**: 3 receipts per expense

        **Base64 Format Options**:
        - With data URI: `"data:image/jpeg;base64,/9j/4AAQ..."`
        - Raw base64: `"/9j/4AAQSkZJRg..."`

        **Alternative: Separate File Upload**:
        You can also upload files separately using `/expenses/file-upload`
        and reference the returned filename in `attachment1`, `attachment2`, or `attachment3`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Expense'
            examples:
              withReceipt:
                summary: Expense with camera-captured receipt
                value:
                  expense_date: "2026-04-06"
                  category: 1
                  payment_method: 1
                  payee: "Office Supplies Inc"
                  amount: 125.50
                  currency: 1
                  notes: "Office supplies for Q2"
                  receipt: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD..."
              withoutReceipt:
                summary: Expense without receipt
                value:
                  expense_date: "2026-04-06"
                  category: 1
                  payment_method: 1
                  payee: "Taxi Service"
                  amount: 35.00
                  notes: "Client meeting transportation"
      responses:
        '201':
          description: Expense created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '400':
          description: Invalid request data or image format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /expense/categories:
    get:
      tags:
        - Expenses
      summary: Get Expense Categories
      description: |
        Retrieves all available expense categories.
        Use the returned `id` when submitting an expense.
      responses:
        '200':
          description: List of expense categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExpenseCategory'

  /expense/payment-methods:
    get:
      tags:
        - Expenses
      summary: Get Payment Methods
      description: |
        Retrieves all available payment methods.
        Use the returned `id` when submitting an expense.
      responses:
        '200':
          description: List of payment methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentMethod'

  /expenses/file-upload:
    post:
      tags:
        - Expenses
      summary: Upload Expense Attachment (Multipart)
      description: |
        Upload an expense attachment using multipart form data.
        This is an alternative to base64 encoding in the expense submission.

        After uploading, use the returned filename in `attachment1`, `attachment2`,
        or `attachment3` fields when creating an expense.

        **Note**: For mobile apps, consider using the base64 `receipt` field
        in POST /expense instead for a simpler single-request workflow.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file to upload (max 10MB)
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: string
                    description: The saved filename to use in expense attachment fields
                    example: "17123456789012345"

  /expenses/all:
    get:
      tags:
        - Expenses
      summary: List All Expense Claims (Admin)
      description: Admin/manager — lists all expense claims for review/approval.
      responses:
        '200':
          description: List of expense claims
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /expense/{id}/approve:
    post:
      tags:
        - Expenses
      summary: Approve an Expense Claim (Admin/Manager)
      description: >-
        Approves the expense. Reuses the multi-level approval chain if one is configured
        (may set the claim to `Processing` until all levels approve). Optional `{"reason":"…"}`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Expense approved
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /expense/{id}/reject:
    post:
      tags:
        - Expenses
      summary: Reject an Expense Claim (Admin/Manager)
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Expense rejected
        '403':
          description: Permission denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Expense not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

