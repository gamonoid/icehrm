        Each extension includes its code, label, features, and version information.
      responses:
        '200':
          description: List of installed extensions
          content:
            application/json:
              example:
                data:
                  - code: "leave_and_performance"
                    installed: true
                    label: "Leave & Performance"
                    features: ["leaves", "performance_reviews"]
                    version: "1.0.0"
                    isGroup: true
                  - code: "expenses"
                    installed: true
                    label: "Expenses"
                    features: ["expenses"]
                    version: "1.0.0"
                    isGroup: false
                  - code: "travel"
                    installed: true
                    label: "Travel Management"
                    features: ["travel_requests"]
                    version: "1.0.0"
                    isGroup: false

  /meta/config:
    get:
      tags:
        - Meta
      summary: List Manageable Config Models (Admin)
      description: >-
        Admin-only. Returns the whitelist of configuration / master-data models you can manage
        via `/meta/config/*` (leave types, holidays, pay grades, job titles, expense categories,
        etc.). Each item is `{model, label}`.
      responses:
        '200':
          description: List of manageable config models
        '403':
          description: Permission denied (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /meta/config/{model}:
    get:
      tags:
        - Meta
      summary: List Config Rows (Admin)
      description: List all rows of a whitelisted config model (e.g. `LeaveType`, `HoliDay`, `PayGrade`).
      parameters:
        - $ref: '#/components/parameters/ConfigModel'
      responses:
        '200':
          description: Rows of the config model
        '400':
          description: Model not manageable / not whitelisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Meta
      summary: Create/Update a Config Row (Admin)
      description: >-
        Create (no `id`) or update (with `id`) a row of a whitelisted config model. The body is
        the model's own fields — call `GET /meta/config/{model}/describe` to see the exact field
        names (column list + form field definitions). Runs the model's own validation, save
        hooks and audit logging.
      parameters:
        - $ref: '#/components/parameters/ConfigModel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The config model's fields (see the describe endpoint).
      responses:
        '200':
          description: Saved row
        '400':
          description: Not whitelisted or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /meta/config/{model}/describe:
    get:
      tags:
        - Meta
      summary: Describe a Config Model's Fields (Admin)
      description: >-
        Returns the model's column names and (when defined) its form-field definitions, so you
        know exactly which fields to send to the create/update endpoint.
      parameters:
        - $ref: '#/components/parameters/ConfigModel'
      responses:
        '200':
          description: 'Field description `{ model, label, columns, formFields }`'
        '400':
          description: Model not whitelisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /meta/config/{model}/{id}:
    delete:
      tags:
        - Meta
      summary: Delete a Config Row (Admin)
      description: Deletes a row of a whitelisted config model. The model's own delete guards apply.
      parameters:
        - $ref: '#/components/parameters/ConfigModel'
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Row deleted
        '400':
          description: Not whitelisted / in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

