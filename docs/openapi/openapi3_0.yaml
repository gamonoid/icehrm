openapi: 3.0.3
info:
  title: IceHRM Pro API
  description: |
    IceHRM is an open-source Human Resource Management system. This API provides
    programmatic access to manage employees, attendance, leave, payroll, projects,
    and other HR-related functions.

    ## Authentication
    All endpoints require Bearer token authentication unless otherwise noted.
    Use the OAuth token endpoint to obtain an access token.

    ## Response Format
    Successful responses return data wrapped in an IceResponse object.
    Error responses use the format: `{"error": [[{"code": 400, "message": "..."}]]}`
  version: 2.0.0
  contact:
    name: IceHRM Support
    url: https://icehrm.com
    email: support@icehrm.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: '{protocol}://{host}/api/v1'
    description: IceHRM API Server
    variables:
      protocol:
        enum: [http, https]
        default: https
      host:
        default: localhost

tags:
  - name: Authentication
    description: User authentication and token management
  - name: Employees
    description: Employee data management
  - name: Attendance
    description: Attendance tracking and punch in/out
  - name: Leave
    description: Leave requests and entitlements
  - name: Documents
    description: Employee and company documents
  - name: Projects
    description: Project management and resource allocation
  - name: Company
    description: Company structure and organization
  - name: Charts
    description: Dashboard analytics and charts
  - name: Meta
    description: Metadata and lookup data
  - name: Settings
    description: Application settings
  - name: Tasks
    description: Task management
  - name: Teams
    description: Team management
  - name: Expenses
    description: Expense tracking and management
  - name: Payroll
    description: Payroll configuration and processing
  - name: Company Assets
    description: Company asset tracking
  - name: Insights
    description: Analytics and reporting insights
  - name: Reports
    description: Advanced report generation
  - name: Learn
    description: Learning management system
  - name: Directory
    description: Staff directory
  - name: Demo Mode
    description: Demo data generation
  - name: Recruitment
    description: Job postings and candidate management
  - name: Timesheets
    description: Timesheet management and time entry tracking

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token authentication

  schemas:
    Error:
      type: object
      properties:
        error:
          type: array
          items:
            type: array
            items:
              type: object
              properties:
                code:
                  type: integer
                message:
                  type: string

    Employee:
      type: object
      properties:
        id:
          type: integer
        employee_id:
          type: string
        first_name:
          type: string
        middle_name:
          type: string
        last_name:
          type: string
        nationality:
          type: string
        birthday:
          type: string
          format: date
        gender:
          type: string
          enum: [Male, Female, Other]
        marital_status:
          type: string
        ssn_num:
          type: string
        nic_num:
          type: string
        other_id:
          type: string
        driving_license:
          type: string
        employment_status:
          type: integer
        job_title:
          type: integer
        pay_grade:
          type: integer
        work_station_id:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        country:
          type: string
        province:
          type: integer
        postal_code:
          type: string
        home_phone:
          type: string
        mobile_phone:
          type: string
        work_phone:
          type: string
        work_email:
          type: string
          format: email
        private_email:
          type: string
          format: email
        joined_date:
          type: string
          format: date
        confirmation_date:
          type: string
          format: date
        supervisor:
          type: integer
        indirect_supervisors:
          type: string
        department:
          type: integer
        termination_date:
          type: string
          format: date
        status:
          type: string
          enum: [Active, Terminated]
        approver1:
          type: integer
        approver2:
          type: integer
        approver3:
          type: integer

    Attendance:
      type: object
      properties:
        id:
          type: integer
        employee:
          type: integer
        in_time:
          type: string
          format: date-time
        out_time:
          type: string
          format: date-time
        note:
          type: string
        work_from_home:
          type: boolean
          description: True if working from home, false if working from office
        map_lat:
          type: number
          format: double
          description: Punch-in GPS latitude
        map_lng:
          type: number
          format: double
          description: Punch-in GPS longitude
        map_out_lat:
          type: number
          format: double
          description: Punch-out GPS latitude
        map_out_lng:
          type: number
          format: double
          description: Punch-out GPS longitude
        in_ip:
          type: string
          description: IP address at punch-in
        out_ip:
          type: string
          description: IP address at punch-out

    LeaveRequest:
      type: object
      properties:
        leave_type:
          type: integer
        start:
          type: string
          format: date
        end:
          type: string
          format: date
        details:
          type: string
        attachment:
          type: string
        days:
          type: object
          additionalProperties:
            type: string
            enum: [Full Day, Half Day - Morning, Half Day - Afternoon]

    EmployeeLeave:
      type: object
      properties:
        id:
          type: integer
        employee:
          type: string
          description: Employee name (first_name + last_name)
        leave_type:
          type: string
          description: Leave type name
        leave_period:
          type: string
          description: Leave period name
        date_start:
          type: string
          format: date
        date_end:
          type: string
          format: date
        details:
          type: string
        status:
          type: string
          enum: [Pending, Approved, Rejected, Cancelled]
        attachment:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time

    LeaveType:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Leave type name (e.g., Annual Leave, Sick Leave)
        supervisor_leave_assign:
          type: string
          enum: ['Yes', 'No']
          description: Whether supervisor can assign this leave type
        employee_can_apply:
          type: string
          enum: ['Yes', 'No']
          description: Whether employee can apply for this leave type
        apply_beyond_current:
          type: string
          enum: ['Yes', 'No']
          description: Allow applying beyond current entitlement
        leave_accrue:
          type: string
          enum: ['Yes', 'No']
          description: Whether leave accrues over time
        carried_forward:
          type: string
          enum: ['Yes', 'No']
          description: Whether unused leave can be carried forward
        default_per_year:
          type: number
          description: Default leave days per year
        leave_color:
          type: string
          description: Color code for calendar display

    LeavePeriod:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          description: Leave period name (e.g., 2024, 2024-2025)
        date_start:
          type: string
          format: date
          description: Period start date
        date_end:
          type: string
          format: date
          description: Period end date
        status:
          type: string
          enum: [Active, Inactive]
          description: Period status

    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        client:
          type: integer
        details:
          type: string
        status:
          type: string
          enum: [Active, Inactive]

    Team:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        department:
          type: integer
        status:
          type: string
          enum: [Active, Inactive]

    Expense:
      type: object
      description: |
        Expense submission with optional receipt image upload.

        **Receipt Upload (Mobile App Support)**:
        Use the `receipt` field to upload a receipt image captured via camera.
        Supports base64-encoded images with or without data URI prefix.

        Examples:
        - With data URI: `"data:image/jpeg;base64,/9j/4AAQ..."`
        - Raw base64: `"/9j/4AAQSkZJRg..."`

        Supported formats: jpg, jpeg, png, gif, bmp, webp, heic, heif
        Maximum file size: 10MB
      properties:
        id:
          type: integer
          readOnly: true
        expense_date:
          type: string
          format: date
          description: Date of the expense
          example: "2026-04-06"
        payment_method:
          type: integer
          description: Payment method ID (from /expense/payment-methods)
        transaction_no:
          type: string
          description: Transaction reference number
        payee:
          type: string
          description: Vendor/payee name
        category:
          type: integer
          description: Expense category ID (from /expense/categories)
        notes:
          type: string
          description: Additional notes about the expense
        currency:
          type: integer
          description: Currency ID
        amount:
          type: number
          format: decimal
          description: Expense amount
          example: 125.50
        receipt:
          type: string
          description: |
            Base64-encoded receipt image (primary attachment).
            Accepts data URI format (data:image/jpeg;base64,...) or raw base64 string.
            Ideal for camera-captured images from mobile apps (Flutter, React Native).
          example: "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD..."
        receipt_filename:
          type: string
          description: Optional original filename for the receipt
          example: "receipt_2026_04_06.jpg"
        receipt2:
          type: string
          description: Base64-encoded second receipt image (optional)
        receipt2_filename:
          type: string
          description: Optional filename for second receipt
        receipt3:
          type: string
          description: Base64-encoded third receipt image (optional)
        receipt3_filename:
          type: string
          description: Optional filename for third receipt
        attachment1:
          type: string
          readOnly: true
          description: Saved filename of first attachment (returned after save)
        attachment2:
          type: string
          readOnly: true
          description: Saved filename of second attachment
        attachment3:
          type: string
          readOnly: true
          description: Saved filename of third attachment
        status:
          type: string
          readOnly: true
          enum: [Pending, Approved, Rejected, Cancelled, Processing, Cancellation Requested]
          description: Approval status of the expense
          example: "Pending"
        category_Name:
          type: string
          readOnly: true
          description: Category name (populated in responses)
        payment_method_Name:
          type: string
          readOnly: true
          description: Payment method name (populated in responses)
        currency_Name:
          type: string
          readOnly: true
          description: Currency code (populated in responses)
      required:
        - category
        - payment_method
        - payee

    ExpenseCategory:
      type: object
      description: Expense category for classifying expenses
      properties:
        id:
          type: integer
          description: Category ID (use this when submitting an expense)
          example: 1
        name:
          type: string
          description: Category name
          example: "Travel"
        pre_approve:
          type: string
          enum: [Yes, No]
          description: Whether expenses in this category are pre-approved
          example: "Yes"

    PaymentMethod:
      type: object
      description: Payment method used for the expense
      properties:
        id:
          type: integer
          description: Payment method ID (use this when submitting an expense)
          example: 1
        name:
          type: string
          description: Payment method name
          example: "Credit Card"

    Timesheet:
      type: object
      description: Employee timesheet for tracking work hours over a period (typically a week)
      properties:
        id:
          type: integer
          readOnly: true
          example: 42
        employee:
          type: integer
          description: Employee ID
          example: 5
        date_start:
          type: string
          format: date
          description: Start date of the timesheet period
          example: "2026-04-05"
        date_end:
          type: string
          format: date
          description: End date of the timesheet period
          example: "2026-04-11"
        status:
          type: string
          enum: [Pending, Submitted, Approved, Rejected]
          description: Current status of the timesheet
          example: "Pending"
        total_time:
          type: string
          readOnly: true
          description: Total time worked (HH:MM format)
          example: "40:30"
        total_minutes:
          type: integer
          readOnly: true
          description: Total time worked in minutes
          example: 2430
        days:
          type: array
          readOnly: true
          description: List of days in the timesheet period
          items:
            type: object
            properties:
              date:
                type: string
                format: date
                example: "2026-04-05"
              display:
                type: string
                example: "(Sun) 05 Apr"
        employee_name:
          type: string
          readOnly: true
          description: Employee full name (included when listing subordinates' timesheets)
          example: "John Smith"

    TimeEntry:
      type: object
      description: Individual time entry within a timesheet
      properties:
        id:
          type: integer
          readOnly: true
          example: 156
        employee:
          type: integer
          readOnly: true
          description: Employee ID
          example: 5
        timesheet:
          type: integer
          description: Parent timesheet ID
          example: 42
        project:
          oneOf:
            - type: integer
            - type: object
              properties:
                type:
                  type: string
                  example: "Project"
                id:
                  type: integer
                display:
                  type: string
          description: Project ID or object with project details
          example: 3
        date:
          type: string
          format: date
          description: Date of the time entry (for creating/updating)
          example: "2026-04-07"
        start_time:
          type: string
          description: Start time (HH:MM:SS format)
          example: "09:00:00"
        end_time:
          type: string
          description: End time (HH:MM:SS format)
          example: "17:30:00"
        date_start:
          type: string
          format: date-time
          readOnly: true
          description: Full start datetime
          example: "2026-04-07 09:00:00"
        date_end:
          type: string
          format: date-time
          readOnly: true
          description: Full end datetime
          example: "2026-04-07 17:30:00"
        details:
          type: string
          description: Description of work performed
          example: "Implemented new API endpoints"
        duration_minutes:
          type: integer
          readOnly: true
          description: Duration in minutes
          example: 510
        duration_hours:
          type: number
          format: float
          readOnly: true
          description: Duration in hours
          example: 8.5
        status:
          type: string
          enum: [Active, Inactive]
          readOnly: true
          example: "Active"

    TimesheetProject:
      type: object
      description: Project available for time entry
      properties:
        id:
          type: integer
          example: 3
        name:
          type: string
          example: "Mobile App Development"

    CustomField:
      type: object
      description: An employee custom field definition (CustomFields row, type = "Employee").
      properties:
        id:
          type: integer
          readOnly: true
          example: 12
        type:
          type: string
          readOnly: true
          description: Owning entity type. Always "Employee" for these endpoints.
          example: "Employee"
        name:
          type: string
          maxLength: 20
          description: Machine name of the field (unique per type, max 20 chars). Used as the value key.
          example: "sg_residency"
        field_type:
          type: string
          enum: [text, textarea, select, select2, select2multi, date, datetime, time, fileupload]
          example: "select"
        field_label:
          type: string
          description: Human-readable label shown on forms.
          example: "Residency Status"
        field_validation:
          type: string
          nullable: true
          description: Optional validation rule.
          example: null
        field_options:
          type: string
          nullable: true
          description: JSON-encoded options for select/select2/select2multi fields.
          example: '[{"value":"SC","label":"Singapore Citizen"},{"value":"PR","label":"PR"}]'
        display:
          type: string
          enum: [Form, "Table and Form", Hidden]
          default: Form
        display_section:
          type: string
          nullable: true
          example: "Payroll"
        display_order:
          type: integer
          default: 0

    CustomFieldCreate:
      type: object
      required: [name, field_type, field_label]
      properties:
        name:
          type: string
          maxLength: 20
          example: "sg_residency"
        field_type:
          type: string
          enum: [text, textarea, select, select2, select2multi, date, datetime, time, fileupload]
          example: "select"
        field_label:
          type: string
          example: "Residency Status"
        field_validation:
          type: string
          nullable: true
        field_options:
          description: >-
            Options for select-type fields. Accepts a JSON string or an array of
            {value, label} objects (arrays are JSON-encoded server-side).
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                properties:
                  value:
                    type: string
                  label:
                    type: string
          example: [{ value: "SC", label: "Singapore Citizen" }, { value: "PR", label: "PR" }]
        display:
          type: string
          enum: [Form, "Table and Form", Hidden]
          default: Form
        display_section:
          type: string
          nullable: true
          example: "Payroll"
        display_order:
          type: integer
          default: 0

    CustomFieldValue:
      type: object
      description: A custom field value for one employee.
      properties:
        name:
          type: string
          description: The custom field name this value belongs to.
          example: "sg_residency"
        value:
          type: string
          description: The stored value (JSON-encoded for multi-select fields).
          example: "SC"
        updated:
          type: string
          format: date-time
          readOnly: true

    PayrollGroup:
      type: object
      description: A payroll group (deduction group) used to scope payroll runs.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
          example: "Monthly Staff"
        description:
          type: string
          maxLength: 100
          nullable: true

    SalaryComponentType:
      type: object
      description: A category tag for salary components (e.g. Basic, Allowance, Bonus).
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 10
          example: "BAS"
        name:
          type: string
          maxLength: 100
          example: "Basic"

    SalaryComponent:
      type: object
      description: A named pay element, optionally tagged with a component type.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
          example: "Basic Salary"
        componentType:
          type: integer
          nullable: true
          description: SalaryComponentType id.
        details:
          type: string
          nullable: true

    EmployeeSalary:
      type: object
      description: A per-employee salary line item (employee + component + amount).
      properties:
        id:
          type: integer
          readOnly: true
        employee:
          type: integer
          description: Employee id.
        component:
          type: integer
          description: SalaryComponent id.
        amount:
          type: number
          format: float
          example: 5500.00
        currency:
          type: integer
          nullable: true
          description: CurrencyType id.
        pay_frequency:
          type: string
          nullable: true
          description: One of Hourly, Daily, Bi Weekly, Weekly, Semi Monthly, Monthly.
          example: "Monthly"
        details:
          type: string
          nullable: true

    Payslip:
      type: object
      description: A generated payslip document for one employee in a payroll run.
      properties:
        employee_id:
          type: integer
        employee_name:
          type: string
        document_id:
          type: integer
        attachment:
          type: string
          description: The backing File name (hash).
        download_url:
          type: string
          nullable: true
          description: Signed download URL for the payslip file.

    PayrollBackup:
      type: object
      description: >-
        A payroll or salary backup. Ids are preserved so a restore recreates rows exactly.
        `tables` maps each backed-up table name to its full list of rows.
      properties:
        type:
          type: string
          example: "icehrm-payroll-backup"
        section:
          type: string
          enum: [salary, payroll]
        version:
          type: integer
          example: 1
        exported_at:
          type: string
          format: date-time
        counts:
          type: object
          additionalProperties:
            type: integer
        tables:
          type: object
          additionalProperties:
            type: array
            items:
              type: object

    EmployeeRef:
      type: object
      nullable: true
      description: A minimal employee reference.
      properties:
        id:
          type: integer
        name:
          type: string
          description: Full name ("First Last").

    TaskListTaskInput:
      description: >-
        A task to add to a task list. Either a plain string (unassigned task
        description) or an object with the task text and an optional assignee.
      oneOf:
        - type: string
          example: Prepare laptop and accounts
        - type: object
          required: [text]
          properties:
            text:
              type: string
            employee:
              type: integer
              description: Employee id to assign this task to (optional).
            checked:
              type: boolean
              description: Whether the task is already completed (default false).

    TaskAssignmentInput:
      type: object
      description: >-
        Assigns a task (by 0-based index into `tasks`) to an employee. Applied
        on top of any inline `employee` set on the task itself.
      required: [task, employee]
      properties:
        task:
          type: integer
          description: 0-based index of the task in the `tasks` array.
        employee:
          type: integer
          description: Employee id to assign the task to.

    TaskListTask:
      type: object
      properties:
        index:
          type: integer
          description: 0-based position of the task within the list.
        text:
          type: string
        checked:
          type: boolean
        employee:
          allOf:
            - $ref: '#/components/schemas/EmployeeRef'
          description: The assigned employee, or null when unassigned.

    TaskListCreate:
      type: object
      required: [name, tasks]
      properties:
        name:
          type: string
        description:
          type: string
          description: Optional description shown under the title.
        type:
          type: string
          description: Task list type. Defaults to "General" when empty.
          default: General
        owner:
          type: integer
          description: >-
            Owner employee id. Defaults to the employee that owns the access
            token when omitted.
        status:
          type: string
          enum: [Draft, Open, On-hold, Completed]
          default: Open
        tasks:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TaskListTaskInput'
        assignments:
          type: array
          description: Optional per-task assignments applied by index.
          items:
            $ref: '#/components/schemas/TaskAssignmentInput'

    TaskListUpdate:
      type: object
      description: >-
        All fields optional. Providing `tasks` replaces the entire task
        checklist (and re-syncs assignments).
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
        owner:
          type: integer
        status:
          type: string
          enum: [Draft, Open, On-hold, Completed]
        can_owner_edit:
          type: boolean
        can_assignees_edit:
          type: boolean
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/TaskListTaskInput'
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/TaskAssignmentInput'

    TaskList:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [Draft, Open, On-hold, Completed]
        owner:
          $ref: '#/components/schemas/EmployeeRef'
        can_owner_edit:
          type: integer
        can_assignees_edit:
          type: integer
        document_link:
          type: string
          description: Editor-document link for the task list.
        assignees:
          type: array
          description: Distinct employees with at least one assigned task.
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              status:
                type: string
                enum: [Pending, Completed]
        tasks:
          type: array
          description: Present on single-item responses (omitted from list responses).
          items:
            $ref: '#/components/schemas/TaskListTask'
        created:
          type: string
        updated:
          type: string

  parameters:
    AuthHeader:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      example: Bearer {accessToken}

    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: integer
      description: Employee ID

    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Resource ID

    ConfigModel:
      name: model
      in: path
      required: true
      schema:
        type: string
      description: >-
        A whitelisted config/master-data model name (e.g. LeaveType, LeaveRule, HoliDay,
        PayGrade, JobTitle, EmploymentStatus, ExpensesCategory). List them via GET /meta/config.

    PeriodParam:
      name: period
      in: path
      required: true
      schema:
        type: string
        enum: [1year, 6months, 2years, 3years, all]
      description: Time period for analytics

security:
  - bearerAuth: []

paths:
  # ============================================
  # AUTHENTICATION
  # ============================================
  /oauth/token:
    post:
      tags:
        - Authentication
      summary: Get OAuth Access Token
      description: Authenticate user and obtain access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - grant_type
                - client_id
                - client_secret
                - username
                - password
              properties:
                grant_type:
                  type: string
                  example: password
                client_id:
                  type: string
                client_secret:
                  type: string
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
        '401':
          description: Authentication failed

  /user/password:
    post:
      tags:
        - Authentication
      summary: Update User Password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
      responses:
        '200':
          description: Password updated successfully

  # ============================================
  # EMPLOYEES
  # ============================================
  /employees:
    get:
      tags:
        - Employees
      summary: Get All Employees
      description: Retrieve list of all employees
      responses:
        '200':
          description: List of employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
    post:
      tags:
        - Employees
      summary: Create Employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        '200':
          description: Employee created successfully

  /employees/me:
    get:
      tags:
        - Employees
      summary: Get Current Employee
      description: Get the employee record for the authenticated user
      responses:
        '200':
          description: Current employee data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'

  /employees/{id}:
    get:
      tags:
        - Employees
      summary: Get Employee by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Employee data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
    put:
      tags:
        - Employees
      summary: Update Employee
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Employee'
      responses:
        '200':
          description: Employee updated successfully
    delete:
      tags:
        - Employees
      summary: Delete Employee
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Employee deleted successfully

  /employees/{id}/skills:
    get:
      tags:
        - Employees
      summary: Get Employee Skills
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: List of employee skills

  /employees/{id}/educations:
    get:
      tags:
        - Employees
      summary: Get Employee Education Records
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: List of employee education records

  /employees/{id}/certifications:
    get:
      tags:
        - Employees
      summary: Get Employee Certifications
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: List of employee certifications

  /employees/{id}/languages:
    get:
      tags:
        - Employees
      summary: Get Employee Languages
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: List of employee languages

  /employees/{id}/status:
    get:
      tags:
        - Employees
      summary: Get Employee Status Message
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Employee status message
    post:
      tags:
        - Employees
      summary: Set Employee Status Message
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
      responses:
        '200':
          description: Status updated successfully

  /employees/{id}/attendance:
    get:
      tags:
        - Employees
      summary: Get Employee Attendance Records
      description: Returns attendance records for a specific employee including work_from_home status
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: List of attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendance'

  /employees/{id}/attendance/summary:
    get:
      tags:
        - Employees
      summary: Get Employee Attendance Summary
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Attendance summary statistics

  /employees/{id}/leaves:
    get:
      tags:
        - Employees
      summary: Get Employee Leave Requests
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: List of leave requests

  /employees/{id}/leaves/summary:
    get:
      tags:
        - Employees
      summary: Get Employee Leave Summary
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Leave balance summary

  /employees/{id}/create-user:
    post:
      tags:
        - Employees
      summary: Create User Account for Employee
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: User account created

  /employees/custom-fields:
    get:
      tags:
        - Employees
      summary: List Employee Custom Field Definitions
      description: >-
        Returns all employee custom field definitions (type = "Employee"),
        ordered by display order. Admin only.
      responses:
        '200':
          description: List of custom field definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomField'
        '403':
          description: Permission denied (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Employees
      summary: Create Employee Custom Field Definition
      description: >-
        Creates a new employee custom field. The field name must be unique for
        the Employee type, at most 20 characters, and not a reserved column
        name. Admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldCreate'
      responses:
        '200':
          description: Custom field created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomField'
        '400':
          description: Validation error (missing/invalid fields, name too long, duplicate name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /employees/custom-fields/{id}:
    delete:
      tags:
        - Employees
      summary: Delete Employee Custom Field Definition
      description: >-
        Deletes an employee custom field definition by id. This cascades to and
        removes all stored values of that field across employees. Admin only.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Custom field deleted
        '403':
          description: Permission denied (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Custom field not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /employees/{id}/custom-fields:
    get:
      tags:
        - Employees
      summary: Get Employee Custom Field Values
      description: >-
        Returns all custom field values set for a specific employee. Admin only.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: List of custom field values for the employee
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomFieldValue'
        '403':
          description: Permission denied (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /employees/{id}/custom-fields/{name}:
    put:
      tags:
        - Employees
      summary: Set Employee Custom Field Value
      description: >-
        Sets or updates the value of a custom field for an employee. The field
        must already be defined for the Employee type. Admin only.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: The custom field name (as defined in the CustomField definition)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  description: >-
                    The value to store. For multi-select fields, pass an array
                    (it is JSON-encoded server-side).
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  example: "SC"
      responses:
        '200':
          description: Value saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: "sg_residency"
                  value:
                    type: string
                    example: "SC"
        '400':
          description: value is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Employee or custom field definition not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Employees
      summary: Delete Employee Custom Field Value
      description: >-
        Deletes the stored value of a custom field for an employee. The field
        definition itself is left untouched. Admin only.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: The custom field name
      responses:
        '200':
          description: Value deleted
        '403':
          description: Permission denied (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Employee not found or value not set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================
  # ATTENDANCE
  # ============================================
  /attendance:
    get:
      tags:
        - Attendance
      summary: Get All Attendance Records
      description: Returns attendance records including work_from_home status
      responses:
        '200':
          description: List of attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendance'
    post:
      tags:
        - Attendance
      summary: Create Attendance Entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                employee:
                  type: integer
                note:
                  type: string
      responses:
        '200':
          description: Attendance entry created

  /attendance/{id}:
    get:
      tags:
        - Attendance
      summary: Get Attendance Entry
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Attendance entry details
    delete:
      tags:
        - Attendance
      summary: Delete Attendance Entry
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Attendance entry deleted

  /attendance/punch-in:
    post:
      tags:
        - Attendance
      summary: Employee Punch In
      description: Record employee punch-in with optional work from home flag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employee
              properties:
                employee:
                  type: integer
                  description: Employee ID
                note:
                  type: string
                  description: Optional note for the punch-in
                in_time:
                  type: string
                  format: date-time
                  description: Punch-in time (defaults to current server time if not provided)
                latitude:
                  type: number
                  format: double
                  description: GPS latitude coordinate
                longitude:
                  type: number
                  format: double
                  description: GPS longitude coordinate
                work_from_home:
                  type: boolean
                  description: Set to true if working from home, false for office (default false)
      responses:
        '201':
          description: Punch in recorded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
        '400':
          description: Bad request (e.g., already punched in)

  /attendance/punch-out:
    post:
      tags:
        - Attendance
      summary: Employee Punch Out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                employee:
                  type: integer
                note:
                  type: string
      responses:
        '200':
          description: Punch out recorded

  /employee/{employeeId}/attendance:
    get:
      tags:
        - Attendance
      summary: Get Attendance for Specific Employee
      description: Returns attendance records for a specific employee including work_from_home status
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '200':
          description: Employee attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendance'

  /employee/{employeeId}/open-punch-in/{date}:
    get:
      tags:
        - Attendance
      summary: Get Open Punch In for Employee
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
        - name: date
          in: path
          required: true
          schema:
            type: string
          example: today
      responses:
        '200':
          description: Open punch in record if exists

  # ============================================
  # LEAVE
  # ============================================
  /leave:
    get:
      tags:
        - Leave
      summary: Get All Leave Requests
      responses:
        '200':
          description: List of leave requests

  /leave/{id}:
    get:
      tags:
        - Leave
      summary: Get Leave Request Details
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Leave request details

  /leave/entitlement:
    get:
      tags:
        - Leave
      summary: Get Leave Entitlement
      description: Get current user's leave entitlement and balances
      responses:
        '200':
          description: Leave entitlement data

  /leave/check/{leaveType}/{startDate}/{endDate}:
    get:
      tags:
        - Leave
      summary: Check Leave Availability
      parameters:
        - name: leaveType
          in: path
          required: true
          schema:
            type: integer
        - name: startDate
          in: path
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Leave availability check result

  /leave/apply:
    post:
      tags:
        - Leave
      summary: Apply for Leave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveRequest'
      responses:
        '200':
          description: Leave request submitted

  /leave/apply-for:
    post:
      tags:
        - Leave
      summary: Apply for Leave on Behalf of an Employee (Admin)
      description: >-
        Admin-only. Creates a leave request for the specified `employeeId` (not the caller).
        Same body as `/leave/apply` plus `employeeId`. Runs the normal balance/overlap logic,
        but the admin level bypasses balance and lock/notice-period checks. The `days` field is
        an object keyed by date (YYYYMMDD or YYYY-MM-DD) whose value is a leave-time-type string
        (`Full Day`, `Half Day - Morning`, `Half Day - Afternoon`, `1/2/3 Hours - Morning/Afternoon`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, leave_type, start, end, days]
              properties:
                employeeId:
                  type: integer
                leave_type:
                  type: integer
                  description: LeaveType id (must be allowed for the employee).
                start:
                  type: string
                  format: date
                end:
                  type: string
                  format: date
                details:
                  type: string
                attachment:
                  type: string
                  description: Optional uploaded filename (from /leave/file-upload).
                days:
                  type: object
                  additionalProperties:
                    type: string
                  example: { "20261215": "Full Day" }
      responses:
        '201':
          description: Leave created for the employee
        '400':
          description: employeeId required / validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission denied (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Employee not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /leave/file-upload:
    post:
      tags:
        - Leave
      summary: Upload Leave Attachment
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: File uploaded successfully

  /leave/direct-reports:
    get:
      tags:
        - Leave
      summary: Get Direct Reports Leave Requests
      description: Get all leave requests from employees who have the current user as their supervisor
      responses:
        '200':
          description: List of leave requests from direct reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeeLeave'
        '401':
          description: Unauthorized
        '404':
          description: No employee record found for current user

  /leave/direct-reports/pending:
    get:
      tags:
        - Leave
      summary: Get Pending Direct Reports Leave Requests
      description: Get only pending leave requests from employees who have the current user as their supervisor
      responses:
        '200':
          description: List of pending leave requests from direct reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EmployeeLeave'
        '401':
          description: Unauthorized
        '404':
          description: No employee record found for current user

  /leave/details/{id}:
    get:
      tags:
        - Leave
      summary: Get Leave Details
      description: Get detailed information about a specific leave request including leave type, leave period, leave days, current balance, and logs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Leave request ID
      responses:
        '200':
          description: Leave details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  id:
                    type: integer
                    description: Leave request ID
                  currentBalance:
                    type: number
                    description: Current leave balance for this leave type
                  leave:
                    $ref: '#/components/schemas/EmployeeLeave'
                  leaveType:
                    $ref: '#/components/schemas/LeaveType'
                  leavePeriod:
                    $ref: '#/components/schemas/LeavePeriod'
                  days:
                    type: array
                    description: Individual leave days breakdown
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        leave_date:
                          type: string
                          format: date
                        leave_type:
                          type: string
                          enum: [Full Day, Half Day - Morning, Half Day - Afternoon]
                  logs:
                    type: array
                    description: Leave request activity logs
                    items:
                      type: object
        '401':
          description: Unauthorized
        '404':
          description: Leave request not found

  /leave/{id}/approve:
    post:
      tags:
        - Leave
      summary: Approve Leave Request
      description: Approve a pending leave request. Only supervisors or authorized approvers can approve leave requests. The note is stored in the leave log (same as web interface).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Leave request ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Approval note (stored in leave log)
                note:
                  type: string
                  description: Alias for reason - approval note (stored in leave log)
      responses:
        '200':
          description: Leave request approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  message:
                    type: string
                    example: Leave request Approved
                  leave:
                    $ref: '#/components/schemas/EmployeeLeave'
        '401':
          description: Unauthorized
        '403':
          description: Not authorized to approve this leave request
        '404':
          description: Leave request not found

  /leave/{id}/reject:
    post:
      tags:
        - Leave
      summary: Reject Leave Request
      description: Reject a pending leave request. Only supervisors or authorized approvers can reject leave requests. The note is stored in the leave log (same as web interface).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Leave request ID
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Rejection reason (stored in leave log)
                note:
                  type: string
                  description: Alias for reason - rejection reason (stored in leave log)
      responses:
        '200':
          description: Leave request rejected successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: SUCCESS
                  message:
                    type: string
                    example: Leave request Rejected
                  leave:
                    $ref: '#/components/schemas/EmployeeLeave'
        '401':
          description: Unauthorized
        '403':
          description: Not authorized to reject this leave request
        '404':
          description: Leave request not found

  # ============================================
  # DOCUMENTS
  # ============================================
  /employees/documents:
    get:
      tags:
        - Documents
      summary: Get All Employee Documents
      responses:
        '200':
          description: List of all employee documents

  /employees/{id}/documents:
    get:
      tags:
        - Documents
      summary: Get Documents for Specific Employee
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: List of employee documents
    post:
      tags:
        - Documents
      summary: Create an Employee Document (Admin)
      description: >-
        Admin-only. Creates a document for employee `{id}`. Upload the file first via
        `POST /employees/documents/file-upload` (multipart field `file`) and pass the returned
        name as `attachment`.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                document:
                  type: integer
                  description: Document-type id (from the Documents lookup).
                attachment:
                  type: string
                  description: File name returned by the file-upload endpoint.
                valid_until:
                  type: string
                  format: date
                details:
                  type: string
                visible_to:
                  type: string
                  enum: [Owner, "Owner Only", Manager, Admin]
                status:
                  type: string
                  enum: [Active, Inactive, Draft]
      responses:
        '201':
          description: Document created
        '403':
          description: Permission denied (admin only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
